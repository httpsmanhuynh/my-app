<p>product-list-call-http-service-component works!</p>
<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Image</th>
    </tr>
  </thead>

  <tbody>
    @for (product of products(); track product.id) {
      <tr class="valid-price">
        <td>{{ product.id }}</td>
        <td>
          <a routerLink="/products/{{ product.id }}">{{ product.name }}</a>
        </td>
        <td>{{ product.price }}</td>
        <td><img [src]="product.image" alt="{{ product.name }}" width="100" height="100" /></td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4">No products available.</td>
      </tr>
    }
  </tbody>
</table>

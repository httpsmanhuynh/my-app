<p>product-list-component works!</p>

<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Image</th>
    </tr>
  </thead>

  <tbody>
    @for (product of products; track $index) {
      @if (product.price > 0) {
        <tr class="valid-price">
          <td>{{ product.id }}</td>
          <td>{{ product.name }}</td>
          <td>{{ product.price }}</td>
          <td><img [src]="product.image" alt="{{ product.name }}" width="100" height="100" /></td>
        </tr>
      } @else {
        <tr class="invalid-price">
          <td>{{ product.id }}</td>
          <td>{{ product.name }}</td>
          <td>{{ product.price }}</td>
          <td><img [src]="product.image" alt="{{ product.name }}" width="100" height="100" /></td>
        </tr>
      }
    }
  </tbody>
</table>
